<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link href="https://fonts.cdnfonts.com/css/jungle-adventurer" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CyberCatch</title>

  <style>

    body {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      text-align: center;
      background-color: #d3d3d3;
      color: black;
      overflow: hidden;
      padding-top: 40px;
    }

    .game-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 80px auto 50px auto;
    }

    /* PLAYER + STAR WRAPPER */

    .player-wrapper {
      position: absolute;
      width: 110px;
      height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* FOUR-STAR SCALE */

    .status-label {
      height: 25px;
      margin-bottom: 7px;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .status-label .filled {
      color: #1976d2;
    }

    .status-label .empty {
      color: #eeeeee;
    }

    /* PLAYERS */

    .player {
      width: 80px;
      height: 80px;
      background-color: #808080;
      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;

      border: 3px solid transparent;

      color: white;

      z-index: 2;

      box-sizing: border-box;
    }

    /* PARTICIPANT */

    .participant-wrapper {
      justify-content: flex-end;
    }

    /* BALL */

    .ball {
      width: 20px;
      height: 20px;
      background-color: green;
      border-radius: 50%;
      position: absolute;

      transition:
        left 0.8s ease-in-out,
        top 0.8s ease-in-out;

      z-index: 3;
      pointer-events: none;
    }

    .info {
      margin-top: 20px;
      font-size: 18px;
    }

    /* SCREENS */

    #nickname-screen,
    #waiting-screen {
      display: none;
      position: absolute;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      background: #d3d3d3;

      justify-content: center;
      align-items: center;
      flex-direction: column;

      z-index: 10;
    }

    #nickname-screen input {
      margin-top: 10px;
      padding: 8px;
      font-size: 16px;
    }

    #nickname-screen button {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #waiting-screen img {
      width: 100px;
      margin-top: 20px;
    }

  </style>
</head>

<body>


<!-- NICKNAME SCREEN -->

<div
  id="nickname-screen"
  style="display:flex; flex-direction:column;"
>
  <h2>Please enter your nickname:</h2>

  <input
    type="text"
    id="nickname-input"
    placeholder="Your name..."
  />

  <button id="start-button">
    Start
  </button>
</div>


<!-- WAITING SCREEN -->

<div id="waiting-screen">

  <h2>
    Waiting for other players to log in...
  </h2>

  <img
    src="https://icon-library.com/images/waiting-icon-gif/waiting-icon-gif-1.jpg"
    alt="Waiting..."
  />

</div>


<!-- GAME SCREEN -->

<div
  id="game-screen"
  style="display:none;"
>

  <h1>CyberCatch</h1>

  <p>
    Click on a player to pass the ball when it's your turn.
  </p>

  <div
    class="game-container"
    id="game-container"
  >

    <!-- AI PLAYER 1 -->

    <div
      class="player-wrapper ai-wrapper"
      id="wrapper-player1"
    >

      <div
        class="status-label"
        id="status-player1"
      ></div>

      <div
        class="player"
        id="player1"
      >
        Casey
      </div>

    </div>


    <!-- AI PLAYER 2 -->

    <div
      class="player-wrapper ai-wrapper"
      id="wrapper-player2"
    >

      <div
        class="status-label"
        id="status-player2"
      ></div>

      <div
        class="player"
        id="player2"
      >
        Taylor
      </div>

    </div>


    <!-- AI PLAYER 3 -->

    <div
      class="player-wrapper ai-wrapper"
      id="wrapper-player3"
    >

      <div
        class="status-label"
        id="status-player3"
      ></div>

      <div
        class="player"
        id="player3"
      >
        Alex
      </div>

    </div>


    <!-- AI PLAYER 4 -->

    <div
      class="player-wrapper ai-wrapper"
      id="wrapper-player4"
    >

      <div
        class="status-label"
        id="status-player4"
      ></div>

      <div
        class="player"
        id="player4"
      >
        Jordan
      </div>

    </div>


    <!-- PARTICIPANT -->

    <div
      class="player-wrapper participant-wrapper"
      style="left:145px; top:285px;"
    >

      <div
        class="player"
        id="player0"
      >
        You
      </div>

    </div>


    <!-- BALL -->

    <div
      class="ball"
      id="ball"
    ></div>

  </div>


  <div
    class="info"
    id="info"
  >
    The game is starting...
  </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", () => {

  let nickname = "You";

  let currentPlayer = "player3";

  let totalThrows = 0;

  const maxThrows = 60;

  let gameEnded = false;

  let gameLog = [];

  let lastPlayerReceiveTime = null;

  const TARGET_PLAYER_RECEIVES = 12;

  let playerReceivesSoFar = 0;


  /* =============================================
     AI PLAYERS
     ============================================= */

  const aiPlayers = [
    "player1",
    "player2",
    "player3",
    "player4"
  ];


  /* =============================================
     HUMAN RECEIVE QUOTAS
     ============================================= */

  const aiQuota = {
    player1: 3,
    player2: 3,
    player3: 3,
    player4: 3
  };


  /* =============================================
     RANDOMIZED STATUS
     ============================================= */

  const playerStatus = {};


  /* =============================================
     RANDOMIZED POSITION
     ============================================= */

  const playerPosition = {};


  /* =============================================
     AVAILABLE SCREEN POSITIONS

     Participant stays fixed at bottom center.
     AI positions are randomized.
     ============================================= */

  const aiPositions = [

    {
      name: "upper-left",
      left: 55,
      top: 20
    },

    {
      name: "upper-right",
      left: 235,
      top: 20
    },

    {
      name: "lower-right",
      left: 285,
      top: 175
    },

    {
      name: "lower-left",
      left: 5,
      top: 175
    }

  ];


  /* =============================================
     SHUFFLE FUNCTION
     ============================================= */

  function shuffle(array) {

    const shuffled = [...array];

    for (
      let i = shuffled.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        shuffled[i],
        shuffled[j]
      ] = [
        shuffled[j],
        shuffled[i]
      ];

    }

    return shuffled;

  }


  /* =============================================
     CREATE FOUR-STAR SCALE
     ============================================= */

  function createStarScale(level) {

    let stars = "";

    for (
      let i = 1;
      i <= 4;
      i++
    ) {

      if (i <= level) {

        stars +=
          '<span class="filled">★</span>';

      } else {

        stars +=
          '<span class="empty">★</span>';

      }

    }

    return stars;

  }


  /* =============================================
     RANDOMIZE STATUS ASSIGNMENT
     ============================================= */

  function randomizeStatuses() {

    /*
      Four players receive:
      1 star
      2 stars
      3 stars
      4 stars

      Each exactly once.
    */

    const shuffledStatuses =
      shuffle([1, 2, 3, 4]);


    aiPlayers.forEach(
      (playerID, index) => {

        const status =
          shuffledStatuses[index];

        playerStatus[playerID] =
          status;


        const label =
          document.getElementById(
            `status-${playerID}`
          );


        label.innerHTML =
          createStarScale(status);


        label.setAttribute(
          "aria-label",
          `${status} out of 4`
        );


        document
          .getElementById(playerID)
          .setAttribute(
            "data-status",
            status
          );

      }
    );

  }


  /* =============================================
     RANDOMIZE PLAYER POSITIONS
     ============================================= */

  function randomizePositions() {

    const shuffledPositions =
      shuffle(aiPositions);


    aiPlayers.forEach(
      (playerID, index) => {

        const position =
          shuffledPositions[index];


        const wrapper =
          document.getElementById(
            `wrapper-${playerID}`
          );


        wrapper.style.left =
          `${position.left}px`;


        wrapper.style.top =
          `${position.top}px`;


        playerPosition[playerID] =
          position.name;

      }
    );

  }


  /* =============================================
     RANDOMIZE EVERYTHING ON PAGE LOAD
     ============================================= */

  randomizeStatuses();

  randomizePositions();


  /* =============================================
     SAVE RANDOMIZATION INFORMATION
     ============================================= */

  const randomizationInfo =
    aiPlayers.map(playerID => ({

      playerID: playerID,

      name:
        document
          .getElementById(playerID)
          .innerText,

      status:
        playerStatus[playerID],

      position:
        playerPosition[playerID]

    }));


  console.log(
    "Randomized player setup:",
    randomizationInfo
  );


  /* =============================================
     START BUTTON
     ============================================= */

  document
    .getElementById("start-button")
    .addEventListener(
      "click",
      function () {

        const input =
          document
            .getElementById(
              "nickname-input"
            )
            .value
            .trim();


        if (!input) {

          alert(
            "Please enter your nickname before starting."
          );

          return;

        }


        nickname =
          input;


        document
          .getElementById("player0")
          .innerText =
            nickname;


        document
          .getElementById(
            "nickname-screen"
          )
          .style.display =
            "none";


        document
          .getElementById(
            "waiting-screen"
          )
          .style.display =
            "flex";


        setTimeout(
          startGame,
          1000
        );

      }
    );


  /* =============================================
     START GAME
     ============================================= */

  function startGame() {

    document
      .getElementById(
        "waiting-screen"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "game-screen"
      )
      .style.display =
        "block";


    moveBall(
      currentPlayer
    );


    setTimeout(
      aiTurn,
      getSlowerReactionTime()
    );


    document
      .querySelectorAll(
        ".player"
      )
      .forEach(
        player => {

          player.addEventListener(
            "click",
            function () {

              if (
                gameEnded ||
                currentPlayer !== "player0" ||
                totalThrows >= maxThrows ||
                this.id === "player0"
              ) {

                return;

              }


              const selectedPlayer =
                this.id;


              const receiverElement =
                document.getElementById(
                  selectedPlayer
                );


              if (!receiverElement) {

                return;

              }


              updateBallHolder(
                selectedPlayer
              );


              totalThrows++;


              const rt =
                lastPlayerReceiveTime

                  ? Date.now() -
                    lastPlayerReceiveTime

                  : null;


              lastPlayerReceiveTime =
                null;


              gameLog.push({

                from:
                  nickname,

                fromID:
                  "player0",

                to:
                  receiverElement.innerText,

                receiverID:
                  selectedPlayer,

                receiverStatus:
                  playerStatus[
                    selectedPlayer
                  ],

                receiverPosition:
                  playerPosition[
                    selectedPlayer
                  ],

                type:
                  "Player",

                rt:
                  rt,

                timestamp:
                  Date.now()

              });


              document
                .getElementById(
                  "info"
                )
                .innerText =

                  `You passed the ball to ${receiverElement.innerText}`;


              setTimeout(
                aiTurn,
                getSlowerReactionTime()
              );

            }
          );

        }
      );

  }


  /* =============================================
     UPDATE BALL HOLDER
     ============================================= */

  function updateBallHolder(
    newHolder
  ) {

    const targetElement =
      document.getElementById(
        newHolder
      );


    if (!targetElement) {

      return;

    }


    moveBall(
      newHolder
    );


    currentPlayer =
      newHolder;


    if (
      newHolder === "player0"
    ) {

      lastPlayerReceiveTime =
        Date.now();

    }

  }


  /* =============================================
     AI REACTION TIME
     ============================================= */

  function getSlowerReactionTime() {

    return (
      Math.floor(
        Math.random() * 701
      ) + 2000
    );

    // 2000–2700 ms

  }


  /* =============================================
     MOVE BALL
     ============================================= */

  function moveBall(
    targetPlayer
  ) {

    const ball =
      document.getElementById(
        "ball"
      );


    const target =
      document.getElementById(
        targetPlayer
      );


    const container =
      document.getElementById(
        "game-container"
      );


    if (
      !ball ||
      !target ||
      !container
    ) {

      return;

    }


    const targetRect =
      target.getBoundingClientRect();


    const containerRect =
      container.getBoundingClientRect();


    const centerX =

      targetRect.left -
      containerRect.left +
      target.offsetWidth / 2 -
      ball.offsetWidth / 2;


    const centerY =

      targetRect.top -
      containerRect.top +
      target.offsetHeight / 2 -
      ball.offsetHeight / 2;


    ball.style.left =
      `${centerX}px`;


    ball.style.top =
      `${centerY}px`;

  }


  /* =============================================
     AI TURN
     ============================================= */

  function aiTurn() {

    if (
      totalThrows >= maxThrows ||
      gameEnded
    ) {

      endRound();

      return;

    }


    const thrower =
      currentPlayer;


    if (
      thrower === "player0"
    ) {

      return;

    }


    let nextPlayer =
      null;


    const remainingTotalThrows =

      maxThrows -
      totalThrows;


    const remainingPlayerReceives =

      TARGET_PLAYER_RECEIVES -
      playerReceivesSoFar;


    const remainingAiThrows =

      Math.max(
        0,
        remainingTotalThrows -
        remainingPlayerReceives
      );


    const quotaForThisAI =

      aiQuota[thrower] || 0;


    /* =============================================
       PROBABILITY OF THROWING TO HUMAN
       ============================================= */

    let pToPlayer =
      0;


    if (
      quotaForThisAI > 0 &&
      remainingAiThrows > 0
    ) {

      const estimatedTurnsForThisAI =

        remainingAiThrows / 4;


      if (
        estimatedTurnsForThisAI > 0
      ) {

        pToPlayer =

          quotaForThisAI /
          estimatedTurnsForThisAI;

      }

    }


    pToPlayer =
      Math.max(
        0,
        Math.min(
          1,
          pToPlayer
        )
      );


    const r =
      Math.random();


    /* =============================================
       THROW TO HUMAN
       ============================================= */

    if (
      quotaForThisAI > 0 &&
      remainingPlayerReceives > 0 &&
      r < pToPlayer
    ) {

      nextPlayer =
        "player0";


      aiQuota[thrower] =
        quotaForThisAI - 1;


      playerReceivesSoFar++;

    }


    /* =============================================
       THROW TO ANOTHER AI
       ============================================= */

    else {

      const aiTargets =

        aiPlayers.filter(
          p => p !== thrower
        );


      const prioritized =

        aiTargets.filter(
          p => aiQuota[p] > 0
        );


      const pool =

        prioritized.length > 0

          ? prioritized

          : aiTargets;


      nextPlayer =

        pool[
          Math.floor(
            Math.random() *
            pool.length
          )
        ];

    }


    const throwerElement =
      document.getElementById(
        thrower
      );


    const receiverElement =
      document.getElementById(
        nextPlayer
      );


    if (
      !throwerElement ||
      !receiverElement
    ) {

      return;

    }


    updateBallHolder(
      nextPlayer
    );


    totalThrows++;


    gameLog.push({

      from:
        throwerElement.innerText,

      fromID:
        thrower,

      throwerStatus:
        playerStatus[
          thrower
        ] || null,

      throwerPosition:
        playerPosition[
          thrower
        ] || null,

      to:
        receiverElement.innerText,

      receiverID:
        nextPlayer,

      receiverStatus:
        playerStatus[
          nextPlayer
        ] || null,

      receiverPosition:
        playerPosition[
          nextPlayer
        ] || null,

      type:
        "AI",

      timestamp:
        Date.now()

    });


    const infoElement =
      document.getElementById(
        "info"
      );


    if (
      nextPlayer === "player0"
    ) {

      infoElement.innerText =

        `${throwerElement.innerText} passed the ball to you – it's your turn!`;

    }

    else {

      infoElement.innerText =

        `${throwerElement.innerText} passed the ball to ${receiverElement.innerText}`;

    }


    if (
      nextPlayer !== "player0"
    ) {

      setTimeout(
        aiTurn,
        getSlowerReactionTime()
      );

    }

  }


  /* =============================================
     END ROUND
     ============================================= */

  function endRound() {

    gameEnded =
      true;


    /*
      Save both the randomization setup
      and all throws in one object.
    */

    const fullGameData = {

      setup:
        randomizationInfo,

      throws:
        gameLog

    };


    const gameLogString =

      JSON.stringify(
        fullGameData
      );


    console.log(
      "📤 Sending to Qualtrics with tag: CyberSizeLog12e"
    );


    console.log(
      fullGameData
    );


    window.parent.postMessage(

      {

        type:
          "CyberSizeLog12e",

        gameLog:
          gameLogString

      },

      "*"

    );


    setTimeout(
      () => {

        window.parent.postMessage(

          {

            type:
              "CyberSizeLog12e",

            gameLog:
              gameLogString

          },

          "*"

        );

      },

      500
    );


    setTimeout(
      () => {

        document.body.innerHTML = `

          <div
            style="
              background-color:#d3d3d3;
              width:100vw;
              height:100vh;
              display:flex;
              align-items:center;
              justify-content:center;
            "
          >

            <div
              style="
                font-size:24px;
                font-weight:bold;
                color:#2c3e50;
              "
            >

              The round has ended!

            </div>

          </div>

        `;

      },

      700
    );

  }

});

</script>

</body>
</html>
