<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link href="https://fonts.cdnfonts.com/css/jungle-adventurer" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberCatch</title>

  <style>
    body {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      text-align: center;
      background-color: #d3d3d3;
      color: black;
      overflow: hidden;
      padding-top: 40px;
    }

    .game-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 80px auto 50px auto;
    }

    .player {
      width: 80px;
      height: 80px;
      background-color: #808080;
      border-radius: 50%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 3px solid transparent;
      color: white;
      z-index: 2;
    }

    .ball {
      width: 20px;
      height: 20px;
      background-color: green;
      border-radius: 50%;
      position: absolute;
      transition: left 0.8s ease-in-out, top 0.8s ease-in-out;
      z-index: 3;
      pointer-events: none;
    }

    .info {
      margin-top: 20px;
      font-size: 18px;
    }

    #nickname-screen,
    #waiting-screen {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: #d3d3d3;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }

    #nickname-screen input {
      margin-top: 10px;
      padding: 8px;
      font-size: 16px;
    }

    #nickname-screen button {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #waiting-screen img {
      width: 100px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div id="nickname-screen" style="display:flex; flex-direction:column;">
    <h2>Please enter your nickname:</h2>
    <input type="text" id="nickname-input" placeholder="Your name..." />
    <button id="start-button">Start</button>
  </div>

  <div id="waiting-screen">
    <h2>Waiting for other players to log in...</h2>
    <img
      src="https://icon-library.com/images/waiting-icon-gif/waiting-icon-gif-1.jpg"
      alt="Waiting..."
    />
  </div>

  <div id="game-screen" style="display:none;">
    <h1>CyberCatch</h1>

    <p>
      Click on a player to pass the ball when it's your turn.
    </p>

    <div class="game-container" id="game-container">

      <div
        class="player"
        id="player3"
        style="left:70px; top:50px;"
      >
        Alex
      </div>

      <div
        class="player"
        id="player2"
        style="left:250px; top:50px;"
      >
        Taylor
      </div>

      <div
        class="player"
        id="player1"
        style="left:300px; top:200px;"
      >
        Casey
      </div>

      <div
        class="player"
        id="player4"
        style="left:20px; top:200px;"
      >
        Jordan
      </div>

      <div
        class="player"
        id="player0"
        style="left:160px; top:300px;"
      >
        You
      </div>

      <div class="ball" id="ball"></div>

    </div>

    <div class="info" id="info">
      The game is starting...
    </div>
  </div>


<script>

document.addEventListener("DOMContentLoaded", function () {

  let nickname = "You";

  let currentPlayer = "player3";

  let totalThrows = 0;

  const maxThrows = 60;

  let gameEnded = false;

  let gameLog = [];

  let lastPlayerReceiveTime = null;

  const TARGET_PLAYER_RECEIVES = 12;

  let playerReceivesSoFar = 0;


  /* ==========================================
     AI RECEIVE QUOTAS
     ========================================== */

  const aiQuota = {
    player1: 3,
    player2: 3,
    player3: 3,
    player4: 3
  };


  /* ==========================================
     POSITION INFORMATION
     ========================================== */

  const aiPlayersForPosition = [
    "player1",
    "player2",
    "player3",
    "player4"
  ];


  const availablePositions = [

    {
      name: "upper-left",
      left: 70,
      top: 50
    },

    {
      name: "upper-right",
      left: 250,
      top: 50
    },

    {
      name: "lower-right",
      left: 300,
      top: 200
    },

    {
      name: "lower-left",
      left: 20,
      top: 200
    }

  ];


  const playerPosition = {};

  let randomizationInfo = [];


  /* ==========================================
     SHUFFLE
     ========================================== */

  function shufflePositions(array) {

    const shuffled = array.slice();

    for (
      let i = shuffled.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      const temp =
        shuffled[i];

      shuffled[i] =
        shuffled[j];

      shuffled[j] =
        temp;
    }

    return shuffled;
  }


  /* ==========================================
     RANDOMIZE PLAYER POSITIONS
     ========================================== */

  function randomizePositions() {

    const randomizedPositions =
      shufflePositions(
        availablePositions
      );


    aiPlayersForPosition.forEach(
      function (playerID, index) {

        const position =
          randomizedPositions[index];

        playerPosition[playerID] =
          position.name;


        const player =
          document.getElementById(
            playerID
          );


        player.style.left =
          position.left + "px";

        player.style.top =
          position.top + "px";

      }
    );


    randomizationInfo =
      aiPlayersForPosition.map(
        function (playerID) {

          return {

            playerID:
              playerID,

            name:
              document
                .getElementById(playerID)
                .innerText
                .trim(),

            position:
              playerPosition[playerID]

          };

        }
      );


    console.log(
      "🎯 Trial 1 player setup:",
      randomizationInfo
    );


    /*
      Send simple position names to Qualtrics.
      No JSON string is used here.
    */

    const positionsForQualtrics = {

      player1:
        playerPosition.player1,

      player2:
        playerPosition.player2,

      player3:
        playerPosition.player3,

      player4:
        playerPosition.player4

    };


    window.parent.postMessage(
      {
        type:
          "CyberCatchPositions",

        positions:
          positionsForQualtrics
      },
      "*"
    );


    console.log(
      "📤 Trial 1 positions sent:",
      positionsForQualtrics
    );

  }


  randomizePositions();


  /* ==========================================
     START BUTTON
     ========================================== */

  document
    .getElementById("start-button")
    .addEventListener(
      "click",
      function () {

        const input =
          document
            .getElementById(
              "nickname-input"
            )
            .value
            .trim();


        if (!input) {

          alert(
            "Please enter your nickname before starting."
          );

          return;
        }


        nickname =
          input;


        document
          .getElementById("player0")
          .innerText =
            nickname;


        document
          .getElementById(
            "nickname-screen"
          )
          .style.display =
            "none";


        document
          .getElementById(
            "waiting-screen"
          )
          .style.display =
            "flex";


        setTimeout(
          startGame,
          1000
        );

      }
    );


  /* ==========================================
     START GAME
     ========================================== */

  function startGame() {

    document
      .getElementById(
        "waiting-screen"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "game-screen"
      )
      .style.display =
        "block";


    moveBall(
      currentPlayer
    );


    setTimeout(
      aiTurn,
      getSlowerReactionTime()
    );


    document
      .querySelectorAll(".player")
      .forEach(
        function (player) {

          player.addEventListener(
            "click",
            function () {

              if (
                gameEnded ||
                currentPlayer !== "player0" ||
                totalThrows >= maxThrows ||
                this.id === "player0"
              ) {

                return;
              }


              const selectedPlayer =
                this.id;


              const receiverElement =
                document.getElementById(
                  selectedPlayer
                );


              if (!receiverElement) {
                return;
              }


              updateBallHolder(
                selectedPlayer
              );


              totalThrows++;


              const rt =
                lastPlayerReceiveTime
                  ? Date.now() -
                    lastPlayerReceiveTime
                  : null;


              lastPlayerReceiveTime =
                null;


              gameLog.push({

                from:
                  nickname,

                fromID:
                  "player0",

                to:
                  receiverElement
                    .innerText
                    .trim(),

                receiverID:
                  selectedPlayer,

                receiverPosition:
                  playerPosition[
                    selectedPlayer
                  ],

                type:
                  "Player",

                rt:
                  rt,

                timestamp:
                  Date.now()

              });


              document
                .getElementById(
                  "info"
                )
                .innerText =

                  "You passed the ball to " +
                  receiverElement.innerText.trim();


              setTimeout(
                aiTurn,
                getSlowerReactionTime()
              );

            }
          );

        }
      );
  }


  /* ==========================================
     UPDATE BALL HOLDER
     ========================================== */

  function updateBallHolder(
    newHolder
  ) {

    const targetElement =
      document.getElementById(
        newHolder
      );


    if (!targetElement) {
      return;
    }


    moveBall(
      newHolder
    );


    currentPlayer =
      newHolder;


    if (
      newHolder ===
      "player0"
    ) {

      lastPlayerReceiveTime =
        Date.now();

    }
  }


  /* ==========================================
     AI REACTION TIME
     ========================================== */

  function getSlowerReactionTime() {

    return (
      Math.floor(
        Math.random() * 701
      ) + 2000
    );

  }


  /* ==========================================
     MOVE BALL
     ========================================== */

  function moveBall(
    targetPlayer
  ) {

    const ball =
      document.getElementById(
        "ball"
      );


    const target =
      document.getElementById(
        targetPlayer
      );


    const container =
      document.getElementById(
        "game-container"
      );


    if (
      !ball ||
      !target ||
      !container
    ) {
      return;
    }


    const targetRect =
      target.getBoundingClientRect();


    const containerRect =
      container.getBoundingClientRect();


    const centerX =

      targetRect.left -
      containerRect.left +
      target.offsetWidth / 2 -
      ball.offsetWidth / 2;


    const centerY =

      targetRect.top -
      containerRect.top +
      target.offsetHeight / 2 -
      ball.offsetHeight / 2;


    ball.style.left =
      centerX + "px";


    ball.style.top =
      centerY + "px";
  }


  /* ==========================================
     AI TURN
     ========================================== */

  function aiTurn() {

    if (
      totalThrows >= maxThrows ||
      gameEnded
    ) {

      endRound();

      return;
    }


    const thrower =
      currentPlayer;


    if (
      thrower === "player0"
    ) {
      return;
    }


    const aiPlayers = [
      "player1",
      "player2",
      "player3",
      "player4"
    ];


    let nextPlayer =
      null;


    const remainingTotalThrows =

      maxThrows -
      totalThrows;


    const remainingPlayerReceives =

      TARGET_PLAYER_RECEIVES -
      playerReceivesSoFar;


    const remainingAiThrows =

      Math.max(
        0,
        remainingTotalThrows -
        remainingPlayerReceives
      );


    const quotaForThisAI =

      aiQuota[thrower] || 0;


    let pToPlayer =
      0;


    if (
      quotaForThisAI > 0 &&
      remainingAiThrows > 0
    ) {

      const estimatedTurnsForThisAI =

        remainingAiThrows /
        4;


      if (
        estimatedTurnsForThisAI > 0
      ) {

        pToPlayer =

          quotaForThisAI /
          estimatedTurnsForThisAI;

      }
    }


    if (
      pToPlayer < 0
    ) {
      pToPlayer = 0;
    }


    if (
      pToPlayer > 1
    ) {
      pToPlayer = 1;
    }


    const r =
      Math.random();


    if (
      quotaForThisAI > 0 &&
      remainingPlayerReceives > 0 &&
      r < pToPlayer
    ) {

      nextPlayer =
        "player0";


      aiQuota[thrower] =
        quotaForThisAI -
        1;


      playerReceivesSoFar++;

    }

    else {

      const aiTargets =

        aiPlayers.filter(
          function (p) {
            return p !== thrower;
          }
        );


      const prioritized =

        aiTargets.filter(
          function (p) {
            return aiQuota[p] > 0;
          }
        );


      const pool =

        prioritized.length > 0
          ? prioritized
          : aiTargets;


      nextPlayer =

        pool[
          Math.floor(
            Math.random() *
            pool.length
          )
        ];

    }


    const throwerElement =
      document.getElementById(
        thrower
      );


    const receiverElement =
      document.getElementById(
        nextPlayer
      );


    if (
      !throwerElement ||
      !receiverElement
    ) {
      return;
    }


    updateBallHolder(
      nextPlayer
    );


    totalThrows++;


    gameLog.push({

      from:
        throwerElement
          .innerText
          .trim(),

      fromID:
        thrower,

      throwerPosition:
        playerPosition[
          thrower
        ] || null,

      to:
        receiverElement
          .innerText
          .trim(),

      receiverID:
        nextPlayer,

      receiverPosition:
        playerPosition[
          nextPlayer
        ] || null,

      type:
        "AI",

      timestamp:
        Date.now()

    });


    const infoElement =
      document.getElementById(
        "info"
      );


    if (
      nextPlayer === "player0"
    ) {

      infoElement.innerText =

        throwerElement.innerText.trim() +
        " passed the ball to you – it's your turn!";

    }

    else {

      infoElement.innerText =

        throwerElement.innerText.trim() +
        " passed the ball to " +
        receiverElement.innerText.trim();

    }


    if (
      nextPlayer !== "player0"
    ) {

      setTimeout(
        aiTurn,
        getSlowerReactionTime()
      );

    }
  }


  /* ==========================================
     END ROUND
     ========================================== */

  function endRound() {

    gameEnded =
      true;


    const fullGameData = {

      setup:
        randomizationInfo,

      throws:
        gameLog

    };


    const gameLogString =

      JSON.stringify(
        fullGameData
      );


    console.log(
      "📤 Sending Trial 1 data:",
      fullGameData
    );


    window.parent.postMessage(
      {
        type:
          "CyberSizeLog12e",

        gameLog:
          gameLogString
      },
      "*"
    );


    setTimeout(
      function () {

        window.parent.postMessage(
          {
            type:
              "CyberSizeLog12e",

            gameLog:
              gameLogString
          },
          "*"
        );

      },
      500
    );


    setTimeout(
      function () {

        document.body.innerHTML =

          '<div style="' +
          'background-color:#d3d3d3;' +
          'width:100vw;' +
          'height:100vh;' +
          'display:flex;' +
          'align-items:center;' +
          'justify-content:center;' +
          '">' +

          '<div style="' +
          'font-size:24px;' +
          'font-weight:bold;' +
          'color:#2c3e50;' +
          '">' +

          'The round has ended!' +

          '</div>' +
          '</div>';

      },
      700
    );
  }

});

</script>

</body>
</html>
