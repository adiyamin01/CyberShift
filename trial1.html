<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link href="https://fonts.cdnfonts.com/css/jungle-adventurer" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberCatch</title>
  <style>
    body {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      text-align: center;
      background-color: #d3d3d3;
      color: black;
      overflow: hidden;
      padding-top: 40px;
    }
    .game-container {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 80px auto 50px auto;
    }
    .player {
      width: 80px;
      height: 80px;
      background-color: #808080;
      border-radius: 50%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: 3px solid transparent;
      color: white;
      z-index: 2;
    }
    .ball {
      width: 20px;
      height: 20px;
      background-color: green;
      border-radius: 50%;
      position: absolute;
      transition: left 0.8s ease-in-out, top 0.8s ease-in-out;
      z-index: 3;
      pointer-events: none;
    }
    .info {
      margin-top: 20px;
      font-size: 18px;
    }
    #nickname-screen, #waiting-screen {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: #d3d3d3;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }
    #nickname-screen input {
      margin-top: 10px;
      padding: 8px;
      font-size: 16px;
    }
    #nickname-screen button {
      font-family: 'Jungle Adventurer', Arial, sans-serif !important;
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    #waiting-screen img {
      width: 100px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="nickname-screen" style="display:flex; flex-direction:column;">
    <h2>Please enter your nickname:</h2>
    <input type="text" id="nickname-input" placeholder="Your name..." />
    <button id="start-button">Start</button>
  </div>

  <div id="waiting-screen">
    <h2>Waiting for other players to log in...</h2>
    <img src="https://icon-library.com/images/waiting-icon-gif/waiting-icon-gif-1.jpg" alt="Waiting..." />
  </div>

  <div id="game-screen" style="display:none;">
    <h1>CyberCatch</h1>
    <p>Click on a player to pass the ball when it's your turn.</p>
    <div class="game-container" id="game-container">
      <div class="player" id="player3" style="left: 70px; top: 50px;">Alex</div>
      <div class="player" id="player2" style="left: 250px; top: 50px;">Taylor</div>
      <div class="player" id="player1" style="left: 300px; top: 200px;">Casey</div>
      <div class="player" id="player4" style="left: 20px; top: 200px;">Jordan</div>
      <div class="player" id="player0" style="left: 160px; top: 300px;">You</div>
      <div class="ball" id="ball"></div>
    </div>
    <div class="info" id="info">The game is starting...</div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  let nickname = "You";
  const players = ["player0", "player1", "player2", "player3", "player4"];
  let currentPlayer = "player3";
  let totalThrows = 0;
  const maxThrows = 60;
  let gameEnded = false;
  let gameLog = [];
  let lastPlayerReceiveTime = null;

  const TARGET_PLAYER_RECEIVES = 12;
  let playerReceivesSoFar = 0;

  const aiQuota = {
    player1: 3,
    player2: 3,
    player3: 3,
    player4: 3
  };

// ==========================================
// RANDOMIZE AI POSITIONS ONCE
// AND SAVE THEM FOR TRIAL 2
// ==========================================

const POSITION_STORAGE_KEY = "CyberCatchPlayerPositions";

const aiPlayersForPosition = [
  "player1", // Casey
  "player2", // Taylor
  "player3", // Alex
  "player4"  // Jordan
];

const availablePositions = [
  { name: "upper-left",  left: 70,  top: 50 },
  { name: "upper-right", left: 250, top: 50 },
  { name: "lower-right", left: 300, top: 200 },
  { name: "lower-left",  left: 20,  top: 200 }
];

function shufflePositions(array) {
  const shuffled = [...array];

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [shuffled[i], shuffled[j]] =
      [shuffled[j], shuffled[i]];
  }

  return shuffled;
}

function randomizeAndSavePositions() {

  const randomizedPositions =
    shufflePositions(availablePositions);

  const assignment = {};

  aiPlayersForPosition.forEach((playerID, index) => {

    const position = randomizedPositions[index];

    assignment[playerID] = position;

    const player =
      document.getElementById(playerID);

    player.style.left = `${position.left}px`;
    player.style.top = `${position.top}px`;
  });

  sessionStorage.setItem(
    POSITION_STORAGE_KEY,
    JSON.stringify(assignment)
  );

  window.parent.postMessage({
  type: "CyberCatchPositions",
  positions: JSON.stringify(assignment)
}, "*");
  
  console.log(
    "Trial 1 randomized positions:",
    assignment
  );
}

randomizeAndSavePositions();

  document.getElementById("start-button").addEventListener("click", function () {
    const input = document.getElementById("nickname-input").value.trim();
    if (!input) {
      alert("Please enter your nickname before starting.");
      return;
    }
    nickname = input;
    document.getElementById("player0").innerText = nickname;
    document.getElementById("nickname-screen").style.display = "none";
    document.getElementById("waiting-screen").style.display = "flex";
    setTimeout(startGame, 1000);
  });

  function startGame() {
    document.getElementById("waiting-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    moveBall(currentPlayer);
    setTimeout(aiTurn, getSlowerReactionTime());

    document.querySelectorAll(".player").forEach(player => {
      player.addEventListener("click", function () {
        if (gameEnded || currentPlayer !== "player0" || totalThrows >= maxThrows || this.id === "player0") return;

        const selectedPlayer = this.id;
        const receiverElement = document.getElementById(selectedPlayer);
        if (!receiverElement) return;

        updateBallHolder(selectedPlayer);
        totalThrows++;

        const rt = lastPlayerReceiveTime ? Date.now() - lastPlayerReceiveTime : null;
        lastPlayerReceiveTime = null;

        gameLog.push({
          from: nickname,
          to: receiverElement.innerText,
          type: "Player",
          rt
        });

        document.getElementById("info").innerText =
          `You passed the ball to ${receiverElement.innerText}`;

        setTimeout(aiTurn, getSlowerReactionTime());
      });
    });
  }

  function updateBallHolder(newHolder) {
    const targetElement = document.getElementById(newHolder);
    if (!targetElement) return;
    moveBall(newHolder);
    currentPlayer = newHolder;
    if (newHolder === "player0") {
      lastPlayerReceiveTime = Date.now();
    }
  }

  function getSlowerReactionTime() {
    return Math.floor(Math.random() * 701) + 2000; // 2000–2700ms
  }

  function moveBall(targetPlayer) {
    const ball = document.getElementById("ball");
    const target = document.getElementById(targetPlayer);
    const container = document.getElementById("game-container");
    if (!ball || !target || !container) return;

    const targetRect = target.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();

    const centerX = targetRect.left - containerRect.left + target.offsetWidth / 2 - ball.offsetWidth / 2;
    const centerY = targetRect.top - containerRect.top + target.offsetHeight / 2 - ball.offsetHeight / 2;

    ball.style.left = `${centerX}px`;
    ball.style.top = `${centerY}px`;
  }

  function aiTurn() {
    if (totalThrows >= maxThrows || gameEnded) {
      endRound();
      return;
    }

    const thrower = currentPlayer;
    if (thrower === "player0") return; // human has to click

    const aiPlayers = ["player1", "player2", "player3", "player4"];

    let nextPlayer = null;

    const remainingTotalThrows = maxThrows - totalThrows;
    const remainingPlayerReceives = TARGET_PLAYER_RECEIVES - playerReceivesSoFar;
    const remainingAiThrows = Math.max(0, remainingTotalThrows - remainingPlayerReceives);

    const quotaForThisAI = aiQuota[thrower] || 0;

    // --- Probability to throw to the human based on remaining quota / expected turns ---
    let pToPlayer = 0;
    if (quotaForThisAI > 0 && remainingAiThrows > 0) {
      const estimatedTurnsForThisAI = remainingAiThrows / 4; // 4 AI players
      if (estimatedTurnsForThisAI > 0) {
        pToPlayer = quotaForThisAI / estimatedTurnsForThisAI;
      }
    }
    if (pToPlayer < 0) pToPlayer = 0;
    if (pToPlayer > 1) pToPlayer = 1;

    const r = Math.random();

    if (quotaForThisAI > 0 && remainingPlayerReceives > 0 && r < pToPlayer) {
      // AI throws to the human
      nextPlayer = "player0";
      aiQuota[thrower] = quotaForThisAI - 1;
      playerReceivesSoFar++;
    } else {
      // AI throws to another AI.
      // NEW RULE: if this AI has 0 quota left, prioritize AIs that still have quota > 0.
      const aiTargets = aiPlayers.filter(p => p !== thrower);
      let prioritized = aiTargets.filter(p => aiQuota[p] > 0);
      let pool = prioritized.length > 0 ? prioritized : aiTargets;
      nextPlayer = pool[Math.floor(Math.random() * pool.length)];
    }

    const throwerElement = document.getElementById(thrower);
    const receiverElement = document.getElementById(nextPlayer);
    if (!throwerElement || !receiverElement) return;

    updateBallHolder(nextPlayer);
    totalThrows++;

    gameLog.push({
      from: throwerElement.innerText,
      to: receiverElement.innerText,
      type: "AI",
      timestamp: Date.now()
    });

    const infoElement = document.getElementById("info");
    infoElement.innerText =
      nextPlayer === "player0"
        ? `${throwerElement.innerText} passed the ball to you – it's your turn!`
        : `${throwerElement.innerText} passed the ball to ${receiverElement.innerText}`;

    if (nextPlayer !== "player0") {
      setTimeout(aiTurn, getSlowerReactionTime());
    }
  }

  function endRound() {
    gameEnded = true;
    const gameLogString = JSON.stringify(gameLog);
    console.log("📤 Sending to Qualtrics with tag: CyberSizeLog12e");
    window.parent.postMessage({ type: "CyberSizeLog12e", gameLog: gameLogString }, "*");
    setTimeout(() => {
      window.parent.postMessage({ type: "CyberSizeLog12e", gameLog: gameLogString }, "*");
    }, 500);
    setTimeout(() => {
      document.body.innerHTML = `
        <div style="background-color: #d3d3d3; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;">
          <div style="font-size: 24px; font-weight: bold; color: #2c3e50;">The round has ended!</div>
        </div>`;
    }, 700);
  }
});
</script>
</body>
</html>
